<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond arrondi + dégradé -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect width="120" height="120" rx="28" fill="url(#glow)"/>

  <!-- Chapeau de diplômé -->
  <g transform="translate(60, 68)">
    <!-- Toit du chapeau (losange) -->
    <path d="M0 -26 L36 -10 L0 8 L-36 -10 Z" fill="white"/>
    <!-- Base du chapeau -->
    <path d="M-24 -2 L-24 16 Q-24 26 -12 26 L12 26 Q24 26 24 16 L24 -2 L0 8 Z" fill="white" opacity="0.85"/>
    <!-- Corde du pompon -->
    <path d="M36 -10 Q43 -3 43 6" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Pompon -->
    <circle cx="43" cy="9" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- Étoile Djibouti -->
  <g transform="translate(93, 26)">
    <path d="M0 -9 L2.6 -2.9 L9.4 -2.9 L4 -1 L6.2 5.6 L0 1.8 L-6.2 5.6 L-4 -1 L-9.4 -2.9 L-2.6 -2.9 Z" fill="#dc2626"/>
  </g>
</svg>